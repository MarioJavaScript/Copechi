<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8ad8ff">
<title>Misión Copechi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="inicio" class="pantalla activa">
    <canvas id="inicio-fondo" class="inicio-fondo" aria-hidden="true"></canvas>
    <div id="inicio-deco" class="inicio-deco" aria-hidden="true"></div>
    <div class="inicio-titulo">
      <h1 class="titulo"><canvas id="titulo" aria-hidden="true"></canvas><span class="sr">Misión Copechi</span></h1>
      <p class="subtitulo">¡Todas y todos podemos!</p>
    </div>
    <div class="inicio-copechi"><canvas class="copechi flota" width="32" height="32" data-expr="contenta" aria-hidden="true"></canvas></div>
    <button id="btn-empezar" class="btn-jugar">▶ ¡Jugar!</button>
  </section>

  <section id="avatar" class="pantalla">
    <h2>¡Crea tu personaje!</h2>
    <canvas id="avatar-grande" class="avatar-grande" width="16" height="16" aria-hidden="true"></canvas>
    <div class="selector"><button class="btn flecha" data-campo="piel" data-d="-1" aria-label="Anterior">◀</button><span class="icono-selector">🙂</span><button class="btn flecha" data-campo="piel" data-d="1" aria-label="Siguiente">▶</button></div>
    <div class="selector"><button class="btn flecha" data-campo="pelo" data-d="-1" aria-label="Anterior">◀</button><span class="icono-selector">💇</span><button class="btn flecha" data-campo="pelo" data-d="1" aria-label="Siguiente">▶</button></div>
    <div class="selector"><button class="btn flecha" data-campo="ropa" data-d="-1" aria-label="Anterior">◀</button><span class="icono-selector">👕</span><button class="btn flecha" data-campo="ropa" data-d="1" aria-label="Siguiente">▶</button></div>
    <button id="btn-listo" class="btn grande">✅ ¡Listo!</button>
  </section>

  <section id="mapa" class="pantalla">
    <div id="mapa-barra" class="mapa-barra">
      <span id="mapa-nombre" class="mapa-nombre"></span>
      <div id="mapa-estrellas" class="mapa-estrellas" aria-hidden="true"></div>
      <button id="btn-flechas" class="btn" aria-label="Mostrar u ocultar flechas">🎮</button>
    </div>
    <canvas id="mapa-canvas" width="176" height="224" aria-label="Mapa de la escuela"></canvas>
    <div id="controles" class="controles">
      <button class="btn" data-dir="izquierda" aria-label="Izquierda">◀</button>
      <button class="btn" data-dir="arriba" aria-label="Arriba">▲</button>
      <button class="btn" data-dir="abajo" aria-label="Abajo">▼</button>
      <button class="btn" data-dir="derecha" aria-label="Derecha">▶</button>
    </div>
  </section>

  <section id="juego" class="pantalla">
    <button id="btn-voz" class="btn bocina-btn" aria-label="Escuchar otra vez"><canvas id="ico-bocina" class="ico"></canvas></button>

    <div id="panel-escena" class="panel">
      <div class="dlg">
        <div class="dlg-cabeza">
          <div class="marco-retrato"><canvas id="retrato" class="retrato" width="32" height="32" aria-hidden="true"></canvas></div>
          <span id="dlg-nombre" class="etiqueta"></span>
        </div>
        <div id="dlg-caja" class="caja-rpg" role="button" tabindex="0" aria-label="Siguiente">
          <p id="texto" class="dlg-texto"></p>
          <span id="dlg-mas" class="mas" aria-hidden="true">▼</span>
        </div>
      </div>
      <div id="opciones" class="opciones-rpg"></div>
    </div>

    <div id="panel-fb" class="panel" hidden>
      <div class="fb-copechi">
        <canvas id="fb-copechi" class="copechi" width="32" height="32" data-expr="contenta" aria-hidden="true"></canvas>
        <div id="fb-chispas" class="fb-chispas" aria-hidden="true"></div>
      </div>
      <div class="dlg">
        <div class="dlg-cabeza"><span class="etiqueta">La Copechi</span></div>
        <div id="fb-caja" class="caja-rpg" role="button" tabindex="0" aria-label="Siguiente">
          <p id="fb-texto" class="dlg-texto"></p>
          <span id="fb-mas" class="mas" aria-hidden="true">▼</span>
        </div>
      </div>
      <button id="btn-seguir" class="btn-rpg c2 grande"><canvas class="ico"></canvas><span></span></button>
    </div>
  </section>

  <section id="final" class="pantalla">
    <div class="fila-final">
      <canvas class="copechi grande" width="32" height="32" data-expr="contenta" aria-hidden="true"></canvas>
      <canvas id="avatar-final" class="avatar-grande" width="16" height="16" aria-hidden="true"></canvas>
    </div>
    <div id="estrellas" class="estrellas" aria-hidden="true"></div>
    <p id="texto-final" class="tarjeta"></p>
    <button id="btn-voz-final" class="btn bocina-btn alta" aria-label="Escuchar otra vez"><canvas id="ico-bocina-final" class="ico"></canvas></button>
    <button id="btn-debate" class="btn grande">💬 Para platicar</button>
  </section>

  <section id="debate" class="pantalla">
    <h2>💬 Para platicar en el salón</h2>
    <ol id="preguntas" class="preguntas"></ol>
    <button id="btn-voz-debate" class="btn bocina-btn alta" aria-label="Escuchar otra vez"><canvas id="ico-bocina-debate" class="ico"></canvas></button>
    <button id="btn-reiniciar" class="btn grande">🔁 Jugar otra vez</button>
  </section>
  <div id="fundido" class="fundido" aria-hidden="true"></div>
</main>
<script src="arte.js"></script>
<script src="mapa.js"></script>
<script src="game.js"></script>
</body>
</html>
